<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091422"><title>地产争锋 · 中文真人联机</title>
<style>
:root{--bg:#081421;--panel:#13263b;--panel2:#192f45;--bd:#365067;--ink:#f2f6f8;--mute:#a2b7c8;--gold:#e7be70;--mint:#63d0aa;--rose:#f47a7e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 45% 0,#1a3852 0%,#0b1b2c 50%,#07111e 100%);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input{border:1px solid var(--bd);border-radius:12px;background:#081726;color:var(--ink);padding:12px;outline:none;min-width:0}input:focus{border-color:var(--gold)}.wrap{max-width:1360px;margin:auto;padding:22px 18px 40px}.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:19px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(135deg,#f5d692,#ad8744);border-radius:14px;color:#1d2b38;font-size:26px;box-shadow:0 8px 25px #f6be5725}.brand h1{margin:0;font-size:23px;letter-spacing:.05em}.brand small{color:var(--mute);font-size:12px}.pill{display:inline-block;border:1px solid #4b695f;background:#1c4d48;color:#91f0cb;padding:5px 10px;border-radius:30px;font-size:12px}.pill.gold{background:#4b3b24;border-color:#8f6e3f;color:#f7dfaf}.btn{border:1px solid #47647f;background:#26445e;color:#fff;border-radius:11px;padding:11px 15px;font-weight:700;transition:background .15s}.btn:hover{background:#335775}.btn.gold{background:linear-gradient(130deg,#f2d18b,#d9ac5a);border-color:#f5d28c;color:#273340}.btn.green{background:#1c735b;border-color:#58ba9b}.btn.danger{background:#743c43;border-color:#bb6770}.btn.flat{background:transparent}.btn.tiny{font-size:12px;padding:6px 10px}.panel{border-radius:18px;background:linear-gradient(150deg,#162a40f5,#0e1d30);border:1px solid #2c445d;box-shadow:0 14px 50px #0004;padding:18px}.landing{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:stretch}.hero{padding:32px}.hero h2{font-size:40px;line-height:1.2;margin:8px 0 12px}.hero p{color:var(--mute);max-width:600px}.check{color:var(--mint)}.fields{display:flex;flex-direction:column;gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#d3e2ef}.field input{width:100%}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:var(--mute)}.small{font-size:12px}.center{text-align:center}.lobby{max-width:800px;margin:10px auto}.roomcode{font-size:32px;letter-spacing:.2em;font-weight:900;color:var(--gold)}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.seat{background:#10243a;border:1px solid #38526b;border-radius:13px;padding:13px;min-width:0}.seat .avatar{font-size:26px}.seat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}.seat small{color:var(--mute)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:15px}.opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.op{background:#142a40;border:1px solid #36536c;border-radius:15px;padding:13px;min-height:166px}.op.turn{border-color:var(--gold);box-shadow:0 0 0 1px #d6b67666}.op h3{font-size:14px;margin:4px 0 6px}.op .small{font-size:11px}.op-meta{display:flex;flex-wrap:wrap;gap:6px}.stat{border-radius:8px;background:#0c1e32;color:#c2d6e7;padding:4px 7px;font-size:11px}.mini-sets{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.miniset{font-size:10px;border:1px solid #526579;padding:3px 6px;border-radius:7px}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.table{border-radius:18px;border:1px solid #366267;background:radial-gradient(ellipse at center,#1c4449,#11303e 67%,#11263a);padding:17px;margin-top:11px}.deckarea{display:flex;gap:23px;align-items:center;justify-content:center;min-height:156px}.deck{height:132px;width:95px;transform:rotate(-5deg);background:repeating-linear-gradient(45deg,#335c7d 0 6px,#29445e 6px 12px);border:6px solid #b3d4df;border-radius:11px;box-shadow:6px 8px #0004;display:grid;place-items:center;text-align:center;font-weight:900}.gamezone{margin-top:11px}.sectionheading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sectionheading h2{font-size:17px;margin:0}.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px}.propgroup{border:1px solid #43647c;border-radius:12px;background:#0f253b;padding:10px;min-height:115px}.propgroup.full{border-color:var(--mint)}.propbar{height:9px;border-radius:20px;margin-bottom:10px}.propgroup h4{font-size:14px;margin:0 0 3px}.propgroup .cards{font-size:11px;color:#d0e0ee}.linkish{text-decoration:underline dotted;cursor:pointer}.hand{display:flex;gap:10px;flex-wrap:wrap;min-height:171px}.card{border:2px solid #ffffff44;border-radius:13px;background:#f7f7f0;color:#17283b;text-align:left;overflow:hidden;width:132px;min-height:171px;padding:0;box-shadow:0 6px 10px #0004;transition:transform .14s}.card:hover:not(:disabled){transform:translateY(-7px)}.card-head{height:39px;background:var(--c);padding:8px 10px;color:#fff;display:flex;justify-content:space-between;font-size:12px;font-weight:800}.card-body{padding:12px 9px}.card-body h4{font-size:17px;line-height:1.25;margin:5px 0 7px}.card-body p{font-size:11px;color:#57677c;margin:0}.side{display:flex;flex-direction:column;gap:11px}.log{height:365px;overflow:auto}.log-item{padding:7px 9px;border-left:2px solid #8ca5bb;background:#ffffff08;border-radius:0 7px 7px 0;font-size:12px;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.num{padding:10px 4px;text-align:center;background:#1b3449;border-radius:11px}.num b{display:block;font-size:20px}.num small{font-size:10px;color:var(--mute)}.shade{position:fixed;inset:0;background:#050b13c9;backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;z-index:50}.modal{background:#172c43;border:1px solid #60809a;border-radius:17px;box-shadow:0 26px 100px #000b;padding:22px;max-width:560px;max-height:92vh;overflow:auto;width:100%}.modal h2{font-size:20px;margin:0 0 6px}.modal p{font-size:13px;color:var(--mute)}.choices{display:grid;gap:8px;margin-top:16px}.choice{border:1px solid #526f89;border-radius:10px;background:#203a52;padding:12px;color:#f3faff;text-align:left}.choice:hover{background:#2c506e}.paylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}.pay{background:#213e51;padding:11px;border:1px solid #56738a;border-radius:10px;color:#fff;text-align:left}.pay.sel{background:#27634e;border-color:#71e2ab}.footer{color:#839db0;text-align:center;font-size:11px;margin:24px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#6a2f39;color:#fff;padding:12px 19px;border:1px solid #cf7e85;border-radius:11px;box-shadow:0 10px 35px #0009;z-index:100;max-width:90vw}.win{font-size:35px;color:var(--gold)}@media(max-width:960px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.landing{grid-template-columns:1fr}}@media(max-width:630px){.wrap{padding:11px 9px}.hero{padding:20px}.hero h2{font-size:30px}.brand h1{font-size:19px}.seats{grid-template-columns:repeat(2,1fr)}.opps{gap:6px}.op{padding:9px;min-height:150px}.op h3{font-size:12px}.deck{width:78px;height:116px}.deckarea{gap:12px}.prop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.propgroup{padding:7px;min-height:98px}.propgroup h4{font-size:12px}.side{display:flex}.hand{gap:6px}.card{width:calc((100% - 12px)/3);min-height:153px}.card-body h4{font-size:14px}.card-body{padding:8px 6px}.card-head{padding:7px}.paylist{grid-template-columns:1fr}.modal{padding:15px}.roomcode{font-size:25px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="logo">🎲</div><div><h1>地产争锋</h1><small>中文版 · 真人在线联机 · 四人对战</small></div></div><div class="flex"><span class="pill" id="conn">● 准备加入</span><span class="pill gold" id="roompill" hidden></span></div></header><main id="app"></main><footer class="footer">106张标准可抽牌 · 3套不同颜色房产获胜 · 对手隐藏手牌只保存在服务器端 · 原创中文游戏界面</footer></div><div id="overlay"></div><div id="toast" class="toast" hidden></div>
<script>
let V=null,token='',room='',es=null,modalLocked=false,dialogKey='';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const colors={brown:'#876344',sky:'#5eaacb',pink:'#ce77ae',orange:'#e38b43',red:'#d45158',yellow:'#dfb63c',green:'#389c6f',navy:'#4365b5',rail:'#647d91',utility:'#8b9f9b'};let toastTimer;
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4500)}
function nameOf(c){return V.rules?.[c]?.n||c}
function cardColor(c){if(c.type==='money')return'#3b976c';if(c.type==='property')return colors[c.color];if(c.type==='wild')return c.colors.length===10?'#9567b4':colors[c.colors[0]];if(c.type==='rent')return c.any?'#728bb7':colors[c.colors[0]];return ['no','breaker'].includes(c.kind)?'#9c67b0': ['house','hotel'].includes(c.kind)?'#bba065':'#5177b6'}
function cardHTML(c,idx){return `<button class="card" data-card="${esc(c.id)}" style="--c:${cardColor(c)}" ${V.turn!==V.me||V.locked||V.winner!==null||V.plays<=0?'disabled':''}><div class="card-head"><span>${idx+1}</span><span>${c.value}M</span></div><div class="card-body"><small>${c.type==='money'?'金钱牌':c.type==='property'?'普通房产':c.type==='wild'?'万能房产':c.type==='rent'?'收租牌':'行动牌'}</small><h4>${esc(c.label)}</h4><p>${c.type==='wild'?'可以选择房产颜色':c.type==='property'?'凑够'+V.rules[c.color].need+'张可成套':c.type==='money'?'只能存银行':c.type==='rent'?'根据自己的房产收租':c.kind==='pass'?'额外摸取2张':c.kind==='no'?'回应攻击时打出':'可作为现金或使用效果'}</p></div></button>`}
async function api(route,data={}){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,token,...data})});let j=await r.json();if(!r.ok||j.error)throw Error(j.error||'网络操作失败');if(j.view){V=j.view;render()}return j}
async function act(route,d){try{await api(route,d)}catch(e){toast(e.message)}}
function joinLink(){return location.origin+location.pathname+'?room='+encodeURIComponent(room)}
function saveIdentity(){localStorage.setItem('deal-room-'+room,token);localStorage.setItem('deal-last-room',room);history.replaceState(null,'',location.pathname+'?room='+room)}
function connect(){es?.close();$('conn').textContent='● 正在连接';es=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));es.onopen=()=>$('conn').textContent='● 实时连接中';es.onerror=()=>$('conn').textContent='● 网络重连中';es.onmessage=e=>{try{V=JSON.parse(e.data);render();syncRequest()}catch(err){console.error(err)}}}
function landing(){const param=new URLSearchParams(location.search).get('room')||'';return `<div class="landing"><section class="panel hero"><span class="pill gold">🎮 中文真人在线房间</span><h2>和朋友一起<br><span style="color:var(--gold)">抢房产，收租金，斗智斗勇。</span></h2><p>创建房间，复制邀请链接给朋友。朋友可以用手机或者电脑直接加入。最多4名真人，不足的人数由电脑补位。</p><p class="check">✓ 全中文操作　 ✓ 真实回合制　 ✓ 实时显示操作　 ✓ 手牌独立保密　 ✓ 自动核对牌数</p></section><section class="panel fields"><h2 style="margin:0">开始游戏</h2><label class="field">你的昵称<input id="nick" placeholder="例如：老马" maxlength="16" autocomplete="nickname"></label><button class="btn gold" id="create">➕ 创建新房间</button><div class="muted center">或者加入朋友的房间</div><label class="field">房间码<input id="code" placeholder="输入6位房间码" maxlength="6" value="${esc(param)}" style="text-transform:uppercase;letter-spacing:.12em"></label><button class="btn green" id="join">🚪 加入房间</button><div class="muted small">首次创建 / 加入后身份会保存在当前浏览器，刷新可以继续游戏。请勿在他人设备分享自己的登录状态。</div></section></div>`}
function lobby(){const ps=V.players;return `<section class="panel lobby"><div class="center"><span class="pill">${V.host?'👑 你是房主':'你已加入'}</span><h2>等待玩家加入</h2><div class="roomcode">${esc(room)}</div><p class="muted">把房间码或下方链接发给朋友</p><div class="flex" style="justify-content:center"><button class="btn gold" id="copy">📋 复制邀请链接</button><button class="btn" id="copycode">复制房间码</button></div></div><div class="seats">${Array.from({length:4},(_,i)=>{const p=ps[i];return `<div class="seat"><div class="avatar">${['😎','🦊','😈','🧐'][i]}</div><b>${p?esc(p.name):'等待加入'}</b><small>${p?'真人玩家':'空位 · 开始后由电脑接管'}</small></div>`}).join('')}</div><p class="small muted">已有 ${ps.length}/4 位真人。${V.host?'你可以立刻开局，剩余空位由电脑补位。':'等待房主点击开始游戏。'}</p>${V.host?'<button class="btn gold" id="start" style="width:100%">▶ 开始对局（电脑补齐空位）</button>':'<button class="btn" disabled style="width:100%">等待房主开局…</button>'}</section>`}
function playerSummary(p){return `<div class="op ${V.turn===p.i?'turn':''}"><div class="flex" style="justify-content:space-between"><span style="font-size:24px">${['😎','🦊','😈','🧐'][p.i]}</span>${V.turn===p.i?'<span class="pill gold">当前行动</span>':''}</div><h3>${esc(p.name)} ${p.ai?'<span class="small muted">电脑</span>':''}</h3><div class="op-meta"><span class="stat">💰 ${p.bank}M</span><span class="stat">🃏 ${p.count}</span><span class="stat">🏆 ${p.complete}/3</span></div><div class="mini-sets">${p.sets.length?p.sets.map(s=>`<span class="miniset"><i class="dot" style="background:${colors[s.color]}"></i>${nameOf(s.color)} ${s.cards.length}/${V.rules[s.color].need}${s.complete?'✓':''}</span>`).join(''):'<span class="small muted">暂无房产</span>'}</div></div>`}
function game(){const me=V.players[V.me],ps=V.players.filter(p=>p.i!==V.me),own=me.sets;const myturn=V.turn===V.me&&V.winner===null;const turnName=V.players[V.turn]?.name||'未知';return `<div class="layout"><div><div class="opps">${ps.map(playerSummary).join('')}</div><div class="table"><div class="sectionheading"><h2>🎲 公共牌桌</h2><span class="pill gold">第 ${V.round} 轮 · ${esc(turnName)}行动</span></div><div class="deckarea"><div class="deck">地 产<br>争 锋<br>🃏</div><div><h3 style="margin:0 0 6px">摸牌堆 · ${V.deck}张</h3><p class="small muted">弃牌堆 ${V.discard} 张<br>${myturn?'你剩余 '+V.plays+' 次出牌':'等待其他玩家出牌'}<br>率先集齐3套不同颜色的完整房产即获胜</p></div></div></div><div class="panel gamezone"><div class="sectionheading"><h2>🏘️ 你的房产</h2><span class="pill">已完成 ${me.complete}/3 套</span></div><div class="prop-grid">${own.length?own.map(s=>`<div class="propgroup ${s.complete?'full':''}"><div class="propbar" style="background:${colors[s.color]}"></div><h4>${nameOf(s.color)} ${s.cards.length}/${V.rules[s.color].need}${s.complete?' ✅':''}</h4><div class="cards">租金 ${s.rent}M<br>${s.cards.map(c=>c.type==='wild'?`<span class="linkish" data-wild="${c.id}">✦万能牌(可换色)</span>`:'▣ 普通房产').join(' ')}</div>${s.bonus.length?'<div class="small">'+s.bonus.join('、')+'</div>':''}</div>`).join(''):'<p class="muted">还没有房产，点击手牌放置。</p>'}</div></div><div class="panel gamezone"><div class="sectionheading"><h2>🃏 你的手牌 · ${V.hand.length}张</h2><span class="pill">银行 ${me.bank}M（${me.bankCount}张）</span></div><div class="hand">${V.hand.length?V.hand.map(cardHTML).join(''):'<p class="muted">手牌为空，下回合摸5张。</p>'}</div><div class="actions" style="margin-top:13px"><button class="btn gold" id="end" ${!myturn||V.locked?'disabled':''}>结束回合 →</button><button class="btn" id="copy">📋 邀请朋友</button><button class="btn flat" id="audit">🔍 检查牌库</button></div></div></div><aside class="side"><div class="panel"><h3 style="margin-top:0">🏆 当前战况</h3><div class="nums"><div class="num"><b>${me.bank}M</b><small>你的银行</small></div><div class="num"><b>${me.complete}/3</b><small>完整套组</small></div><div class="num"><b>${V.plays}</b><small>当前剩余出牌</small></div></div>${V.winner!==null?`<div class="center"><p class="win">🏆 ${esc(V.players[V.winner].name)}获胜！</p><p class="muted">本局已结束</p></div>`:V.locked?'<p class="small muted">⏸ 正在等待攻击反制或支付结算</p>':''}</div><div class="panel"><h3 style="margin-top:0">📜 实时战报</h3><div class="log">${[...V.logs].reverse().map(l=>'<div class="log-item">'+esc(l)+'</div>').join('')}</div></div><div class="panel"><h3 style="margin-top:0">📏 中文规则</h3><div class="small muted">每次回合先摸2张；若回合开始没有手牌则摸5张。每回合最多出3张。结束时手牌最多7张；银行牌不找零。房产不能存银行。行动遭到反制时可使用「说不！」。所有人的隐藏手牌由服务器保管。</div></div></aside></div>`}
function render(){if(!V)return;$('roompill').hidden=false;$('roompill').textContent='房间 '+room;$('app').innerHTML=!V.started?lobby():game();$('copy')?.addEventListener('click',copyInvite);$('copycode')?.addEventListener('click',()=>navigator.clipboard.writeText(room).then(()=>toast('房间码已复制')).catch(()=>toast(room)));$('start')?.addEventListener('click',()=>act('start'));$('end')?.addEventListener('click',()=>{if(V.hand.length>7)discardDialog();else act('end')});$('audit')?.addEventListener('click',()=>{const a=V.audit;simpleAlert('牌组核验',`总数 ${a.total}/106；抽牌堆 ${a.deck}；弃牌 ${a.discard}；手牌 ${a.hand}；银行 ${a.bank}；房产 ${a.property}。${a.ok?'✅ 全部牌唯一归属':'❌ 牌组存在异常'}`)});document.querySelectorAll('[data-card]').forEach(e=>e.addEventListener('click',()=>cardMenu(e.dataset.card)));document.querySelectorAll('[data-wild]').forEach(e=>e.addEventListener('click',()=>moveWild(e.dataset.wild)))}
function modal(title,desc,items,cancel=true){return new Promise(resolve=>{modalLocked=true;let opts=items.map((v,i)=>`<button class="choice" data-opt="${i}">${esc(v.text)}</button>`).join('');$('overlay').innerHTML=`<div class="shade"><div class="modal"><h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="choices">${opts}</div>${cancel?'<button class="btn flat" id="cancel" style="margin-top:14px">返回 / 取消</button>':''}</div></div>`;document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>finish(items[Number(e.dataset.opt)].value));if(cancel)$('cancel').onclick=()=>finish(null);function finish(v){$('overlay').innerHTML='';modalLocked=false;resolve(v)}})}
function simpleAlert(title,msg){return modal(title,msg,[{text:'知道了',value:true}],false)}
async function pick(title,desc,options){if(!options.length){toast('当前没有合法目标');return null}return modal(title,desc,options)}
async function copyInvite(){let link=joinLink();if(['localhost','127.0.0.1'].includes(location.hostname)){const address=window.prompt('当前是本机地址，不能直接发给异地朋友。请输入朋友也能访问的网址（同一Wi-Fi填 http://电脑内网IP:3000；异地填部署后的 https://网址）。也可以按取消只复制6位房间码。','');if(!address){try{await navigator.clipboard.writeText(room);toast('已复制房间码。朋友需要先打开你部署/共享的游戏网址。')}catch(e){toast('房间码：'+room)}return}try{link=new URL(location.pathname+'?room='+room,address).href}catch(e){toast('请输入完整网址，例如 http://192.168.1.100:3000');return}}try{await navigator.clipboard.writeText(link);toast('邀请链接已复制，发给朋友即可加入！')}catch(e){window.prompt('复制这个邀请链接给朋友：',link)}}
async function cardMenu(id){const x=V.hand.find(c=>c.id===id);if(!x)return;const modes=[];if(['property','wild'].includes(x.type))modes.push({text:'🏘️ 放进房产区',value:'property'});else{modes.push({text:'💰 存入银行（'+x.value+'M）',value:'bank'});if(x.type==='rent'||x.type==='action'&&!['no','double'].includes(x.kind))modes.unshift({text:'⚡ 发动这张卡的效果',value:'effect'})}const mode=await pick(x.label,'你可以选择卡牌用途；出牌后通常无法撤销。',modes);if(!mode)return;const arg={card:id,mode};if(mode==='property'&&x.type==='wild'){const c=await pick('选择房产颜色','双色/万能牌只能加入允许的颜色套组。',x.colors.map(c=>({text:nameOf(c),value:c})));if(!c)return;arg.color=c}
 if(mode==='effect'){const ok=await collectAction(x,arg);if(!ok)return}
 await act('play',arg)}
async function collectAction(x,a){if(x.type==='rent'){const cs=x.colors.filter(c=>V.players[V.me].sets.some(s=>s.color===c&&s.cards.length));if(!cs.length){toast('还没有可以收租的对应颜色房产');return false}const c=await pick('选择收租颜色','依据当前房产套组计算金额。',cs.map(c=>({text:nameOf(c)+'房产',value:c})));if(!c)return false;a.color=c;if(x.any){const t=await chooseTarget('任意颜色收租');if(t===null)return false;a.target=t}const doubles=V.hand.filter(z=>z.kind==='double'&&z.id!==x.id);if(doubles.length&&V.plays>=2){a.double=(await pick('双倍租金？','再消耗一张双倍租金牌及一次出牌机会。',[{text:'不加倍',value:false},{text:'×2 加倍租金',value:true}]))||false}return true}
 if(x.kind==='debt'){const t=await chooseTarget('收债5M');if(t===null)return false;a.target=t;return true}
 if(['sly','forced','breaker'].includes(x.kind)){const os=V.options.filter(o=>o.type===(x.kind==='breaker'?'full':'single'));const chosen=await pick(x.label,'请选择符合规则的目标房产',os.map((o,k)=>({text:o.title,value:k})));if(chosen===null)return false;const p=os[chosen];a.target=p.target;if(x.kind==='breaker')a.setId=p.setId;else{a.targetCard=p.card;if(x.kind==='forced'){const my=V.players[V.me].sets.filter(s=>!s.complete).flatMap(s=>s.cards.map(c=>({id:c.id,label:c.label,color:s.color})));const c=await pick('选择你要交出的房产','强制交易必须交换双方各一张非完整套组的房产。',my.map(x=>({text:nameOf(x.color)+' · '+x.label,value:x.id})));if(!c)return false;a.myCard=c}}return true}
 if(['house','hotel'].includes(x.kind)){const opts=V.players[V.me].sets.filter(s=>s.complete&&!['rail','utility'].includes(s.color)&& (x.kind==='house'?!s.bonus.includes('房屋'):s.bonus.includes('房屋')&&!s.bonus.includes('酒店')));const s=await pick(x.label,'选择要添加的完整房产套组。',opts.map(s=>({text:nameOf(s.color),value:s.id})));if(!s)return false;a.setId=s;return true}return true}
async function chooseTarget(title){return pick(title,'选择一名其他玩家。',V.players.filter(p=>p.i!==V.me).map(p=>({text:p.name+' · 银行'+p.bank+'M',value:p.i})))}
async function moveWild(id){if(V.turn!==V.me||V.locked){toast('只能在自己回合调整万能牌');return}const c=V.players[V.me].sets.flatMap(s=>s.cards).find(c=>c.id===id);if(!c||!c.colors)return;const col=await pick('万能房产换色','自己回合调整颜色不占用3次出牌。',c.colors.map(v=>({text:nameOf(v),value:v})));if(col)act('wild',{card:id,color:col})}
async function discardDialog(){const n=V.hand.length-7;let sel=new Set();modalLocked=true;function update(){ $('overlay').innerHTML=`<div class="shade"><div class="modal"><h2>弃掉 ${n} 张手牌</h2><p>结束回合时最多保留7张。已选择 ${sel.size}/${n} 张。</p><div class="paylist">${V.hand.map(c=>`<button class="pay ${sel.has(c.id)?'sel':''}" data-dis="${esc(c.id)}">${sel.has(c.id)?'☑':'□'} ${esc(c.label)} · ${c.value}M</button>`).join('')}</div><button class="btn gold" id="disgo" ${sel.size!==n?'disabled':''}>确定弃牌</button><button class="btn flat" id="discancel">返回</button></div></div>`;document.querySelectorAll('[data-dis]').forEach(el=>el.onclick=()=>{sel.has(el.dataset.dis)?sel.delete(el.dataset.dis):sel.add(el.dataset.dis);update()});$('disgo').onclick=async()=>{$('overlay').innerHTML='';modalLocked=false;try{await api('discard',{ids:[...sel]});await api('end')}catch(e){toast(e.message)}};$('discancel').onclick=()=>{$('overlay').innerHTML='';modalLocked=false}}update()}
function syncRequest(){if(!V?.request){if(dialogKey){dialogKey='';$('overlay').innerHTML='';modalLocked=false}return}const r=V.request;const key=JSON.stringify([r.type,r.amount,r.description,r.active,r.assets?.map(a=>a.id)]);if(dialogKey===key)return;dialogKey=key;if(r.type==='reaction'){modalLocked=true;$('overlay').innerHTML=`<div class="shade"><div class="modal"><h2>🛡️ 你要反制吗？</h2><p>${esc(r.description)}。${r.active?'行动将对你生效。':'你之前的行动正被对方反制。'}</p><div class="choices">${r.canNo?'<button class="choice" id="sayno">🛡️ 使用「说不！」（不占正常出牌次数）</button>':''}<button class="choice" id="allow">${r.active?'不反制，继续结算':'放弃反制，行动取消'}</button></div></div></div>`;$('sayno')?.addEventListener('click',()=>act('respond',{choice:'no'}));$('allow').onclick=()=>act('respond',{choice:'allow'})}
 if(r.type==='payment'){modalLocked=true;let selected=new Set();const assets=r.assets||[],avail=assets.reduce((s,x)=>s+x.v,0);function update(){const total=assets.filter(x=>selected.has(x.id)).reduce((s,x)=>s+x.v,0),valid=total>=r.amount||(avail<r.amount&&total===avail);$('overlay').innerHTML=`<div class="shade"><div class="modal"><h2>💸 需要支付 ${r.amount}M</h2><p>收款方：${esc(r.payTo)}。请选择银行牌或房产，超额不找零。总资产不足时必须交出全部。</p><div class="paylist">${assets.map(x=>`<button class="pay ${selected.has(x.id)?'sel':''}" data-pay="${esc(x.id)}">${selected.has(x.id)?'☑':'□'} ${esc(x.label)} · ${x.v}M<br><small>${x.zone==='bank'?'银行':x.complete?'完整套组 ⚠':'房产'}</small></button>`).join('')}</div><p>已选择 ${total}M / 应付 ${r.amount}M</p><button class="btn gold" id="paygo" ${!valid?'disabled':''}>确认付款</button></div></div>`;document.querySelectorAll('[data-pay]').forEach(e=>e.onclick=()=>{selected.has(e.dataset.pay)?selected.delete(e.dataset.pay):selected.add(e.dataset.pay);update()});$('paygo').onclick=()=>act('respond',{ids:[...selected]})}update()}}
async function setup(){const urlRoom=(new URLSearchParams(location.search).get('room')||'').toUpperCase(),last=localStorage.getItem('deal-last-room');const tryRoom=urlRoom||last;if(tryRoom&&localStorage.getItem('deal-room-'+tryRoom)){room=tryRoom;token=localStorage.getItem('deal-room-'+room);try{V=await api('state');saveIdentity();connect();render();return}catch(e){room='';token='';V=null;toast('原房间无法恢复：'+e.message)}}
 $('app').innerHTML=landing();$('create').onclick=async()=>{try{const data=await api('create',{name:$('nick').value});room=data.room;token=data.token;V=data.view;saveIdentity();render();connect()}catch(e){toast(e.message)}};$('join').onclick=async()=>{try{const c=$('code').value.trim().toUpperCase();if(c.length!==6)throw Error('请输入6位房间码');const data=await api('join',{room:c,name:$('nick').value});room=data.room;token=data.token;V=data.view;saveIdentity();render();connect()}catch(e){toast(e.message)}}}
setup();
</script></body></html>
